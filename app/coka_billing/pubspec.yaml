name: coka_billing
description: "COKA Billing - Billing & Inventory Software for COKA Coimbatore Original Kaalan Adda"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local database
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # Networking
  http: ^1.3.0

  # Firebase (REST-based to match original app pattern)
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6

  # CSV export
  csv: ^6.0.0

  # Date formatting
  intl: ^0.20.2

  # File management
  share_plus: ^10.1.4

  # Bluetooth (Android only)
  flutter_bluetooth_serial: ^0.4.0

  # Local storage for env-like config
  shared_preferences: ^2.4.0

  # File picker for CSV import
  file_picker: ^8.0.0

  # Toast/Snackbar
  fluttertoast: ^8.2.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FF1A1A1A"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/

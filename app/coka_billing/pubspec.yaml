name: coka_billing
description: "COKA Billing - Billing & Inventory Software for COKA Coimbatore Original Kaalan Adda"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local database (cross-platform: mobile, desktop, web)
  sembast: ^3.8.9
  sembast_web: ^2.4.5
  path_provider: ^2.1.5
  path: ^1.9.1

  # Networking
  http: ^1.3.0

  # Firebase (REST-based to match original app pattern)
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0


  # CSV export
  csv: ^8.0.0

  # Date formatting
  intl: ^0.20.2

  # File management
  share_plus: ^12.0.2

  # Bluetooth printing (Android)
  flutter_bluetooth_serial: ^0.4.0

  # Local storage for env-like config
  shared_preferences: ^2.4.0

  # File picker for CSV import
  file_picker: ^11.0.2

  # Password hashing
  crypto: ^3.0.6

  # Structured logging
  logging: ^1.3.0

  # Toast/Snackbar
  fluttertoast: ^9.1.0
  qr_flutter: ^4.1.0

  # Runtime permissions (Android 12+)
  permission_handler: ^12.0.3

  # Windows USB/COM port printing (FFI)
  ffi: ^2.1.0
  package_info_plus: ^9.0.1
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FF1A1A1A"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/

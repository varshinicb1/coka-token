name: Flutter CI

on:
  push:
    branches: [main, opening-day-offer]
  pull_request:
    branches: [main, opening-day-offer]

defaults:
  run:
    working-directory: app/coka_billing

jobs:
  test:
    name: Test & Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
